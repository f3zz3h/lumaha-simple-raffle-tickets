name: PHP checks
run-name: PHP checks on ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the plugin's minimum ("Requires PHP").
        php: ['7.4', '8.0', '8.3']
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Check PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $status
