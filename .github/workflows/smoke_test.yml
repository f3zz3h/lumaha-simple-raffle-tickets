name: Install smoke test
run-name: Install smoke test on ${{ github.ref_name }} by ${{ github.actor }}

# Installs the built zips on a fresh WordPress with WooCommerce and checks the plugin loads,
# the GitHub updater offers a (fake) newer release, and the WordPress.org zip has no updater.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Set up PHP 8.3 and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: wp-cli

      # Latest WordPress and WooCommerce, so we notice when either breaks the plugin.
      - name: Install WordPress and WooCommerce
        run: |
          wp core download --path=wp --quiet
          wp config create --path=wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --quiet
          wp config set --path=wp WP_DEBUG true --raw --quiet
          wp config set --path=wp WP_DEBUG_LOG true --raw --quiet
          wp config set --path=wp WP_DEBUG_DISPLAY false --raw --quiet
          wp core install --path=wp --url=http://localhost --title="Smoke test" --admin_user=admin --admin_password=smoke-test --admin_email=admin@example.com --skip-email --quiet
          wp plugin install woocommerce --path=wp --quiet
          echo "WordPress $(wp core version --path=wp), WooCommerce $(wp plugin get woocommerce --field=version --path=wp)"

      # The same zips a release would publish.
      - name: Build zips
        run: |
          bash plugin/.github/scripts/build-zip.sh
          bash plugin/.github/scripts/build-zip.sh --wporg

      - name: Run smoke test
        run: bash plugin/tests/smoke/run.sh
        env:
          WP_PATH: wp
          DIST: ${{ github.workspace }}/plugin/dist

      - name: Show debug log
        if: always()
        run: |
          if [ -f wp/wp-content/debug.log ]; then tail -n 100 wp/wp-content/debug.log; else echo "No debug log"; fi
